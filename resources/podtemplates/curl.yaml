apiVersion: v1
kind: Pod
spec:
  automountServiceAccountToken: false
  nodeSelector:
    workload: agent
  tolerations:
  - key: workload
    operator: Equal
    value: agent
    effect: NoSchedule
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: curl
    # Pinned tag (use a digest in production)
    image: curlimages/curl:8.10.1
    command:
    - sleep
    args:
    - infinity
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "250m"
        memory: "128Mi"
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
